name: Mastery Assistant CI

on:
  push:
    branches:
      - "feat/blox-fruits-mastery-assistant"
    paths:
      - "mastery_assistant/**"
      - ".github/workflows/mastery-assistant-ci.yml"
  pull_request:
    paths:
      - "mastery_assistant/**"
      - ".github/workflows/mastery-assistant-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r mastery_assistant/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q mastery_assistant
      - name: Run routine safety tests
        working-directory: mastery_assistant
        run: python -m pytest -q
